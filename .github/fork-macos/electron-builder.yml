extends: ./electron-builder.yml
appId: io.github.david-yang-pixel.workbench
extraResources:
  - from: ../../LICENSE
    to: LICENSE-Codync.txt
  - from: ../../NOTICE
    to: NOTICE-Codync.txt
publish:
  provider: github
  owner: david-yang-pixel
  repo: Codync
  releaseType: prerelease
mac:
  identity: "-"
  # Ad hoc signatures have no Team ID for hardened runtime library validation.
  hardenedRuntime: false
  notarize: false
  timestamp: none
dmg:
  writeUpdateInfo: false
